name: Build Windows installer

# Run it by hand (Actions tab -> Build Windows installer -> Run workflow),
# or push a tag such as v1.0.0 to also publish the files as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check the shell logic
        run: npm test

      - name: Build installer and portable program
        run: npm run dist
        env:
          # Unsigned build. To sign it, store your certificate in the repository secrets
          # CSC_LINK and CSC_KEY_PASSWORD and delete the next line.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: Disciples-PreCenter-Windows
          path: |
            dist/Disciples-PreCenter-Setup-*.exe
            dist/Disciples-PreCenter-Portable-*.exe
          if-no-files-found: error

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Disciples-PreCenter-Setup-*.exe
            dist/Disciples-PreCenter-Portable-*.exe
