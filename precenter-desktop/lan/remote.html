<body>
<div id="lanHome" hidden><h1>PreCenter Remote</h1><p>Connected over this Wi-Fi.</p><button class="pri" id="lanGo">Open remote</button><button id="lanSite">Back to Disciples</button></div>
<button id="remoteOpenBtn" hidden aria-hidden="true" tabindex="-1"></button>
<script>
(function(){
  var q=new URLSearchParams(location.search),pin=q.get('pin')||'';
  try{if(pin){localStorage.setItem('dscLanPin',pin);history.replaceState(null,'',location.pathname)}else pin=localStorage.getItem('dscLanPin')||''}catch(e){}
  var L=window.dscLan={open:false,ms:null,host:location.host},sentAt=0,ws=null,subs=[],last=null,isOpen=false,everOpen=false,fails=0,timer=0,pingBad=false;
  function snap(){return{exists:!!last,data:function(){return last}}}
  function emitErr(code){subs.slice().forEach(function(s){try{s.err&&s.err({code:code})}catch(e){}})}
  function connect(){
    if(ws&&(ws.readyState===0||ws.readyState===1))return;
    clearTimeout(timer);
    try{ws=new WebSocket('ws://'+location.host+'/ws?pin='+encodeURIComponent(pin))}catch(e){retry();return}
    var w=ws;
    w.onopen=function(){isOpen=true;everOpen=true;fails=0;L.open=true;beat()};
    w.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t==='hb'){if(sentAt){var d=Math.round(performance.now()-sentAt);L.ms=L.ms==null?d:Math.round(L.ms*0.5+d*0.5);sentAt=0}return}
      if(m.t==='state'){last=m.d;subs.slice().forEach(function(s){try{s.cb(snap())}catch(x){console.error(x)}})}};
    w.onclose=function(){if(w!==ws)return;isOpen=false;L.open=false;fails++;
      /* closed before ever opening: wrong PIN (the computer answers 401) or the computer is not reachable */
      fetch('/ping',{cache:'no-store'}).then(function(r){return r.ok}).catch(function(){return false}).then(function(up){
        emitErr(up&&!everOpen&&fails>1?'permission-denied':'unavailable');retry()})};
    w.onerror=function(){try{w.close()}catch(e){}};
  }
  function retry(){clearTimeout(timer);timer=setTimeout(connect,Math.min(5000,700*fails+700))}
  function beat(){if(isOpen)try{sentAt=performance.now();ws.send('{"t":"hb"}')}catch(e){}}
  setInterval(beat,2500);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!isOpen){fails=0;connect()}});
  window.addEventListener('online',function(){fails=0;connect()});
  window.firestoreDb={collection:function(c){return{doc:function(){return{
    onSnapshot:function(cb,err){var s={cb:cb,err:err};subs.push(s);connect();if(last)setTimeout(function(){try{cb(snap())}catch(e){}},0);
      return function(){subs=subs.filter(function(x){return x!==s})}},
    collection:function(){return{add:function(doc){return new Promise(function(ok,no){
      if(!isOpen){no({code:'unavailable'});return}
      try{ws.send(JSON.stringify({t:'cmd',c:doc}));ok()}catch(e){no(e)}})}}}
  }}}}};
  window.firebaseAuth={currentUser:{uid:'lan'}};
  window.firebaseReadyPromise=Promise.resolve();
  window.getActiveTeamId=function(){return'lan'};
  window.showToast=function(m){var t=document.getElementById('lanToast');if(!t){t=document.createElement('div');t.id='lanToast';t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20000;background:#26262b;color:#fff;border:1px solid rgba(255,255,255,.15);padding:9px 16px;border-radius:999px;font:600 14px system-ui,sans-serif;max-width:86vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none';document.body.appendChild(t)}
    t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0},1800)};
})();
</script>
<script id="remoteJs">
/* ===== Remote control for PreCenter (the lyrics presenter on the computer) =====
   Reads presenter/{teamId} (what the computer is showing) and sends button
   presses to presenterCmd/{teamId}/q. Same Disciples team = automatically paired.

   BACKGROUND (optional) — presenter/{teamId} may carry:
     bg:  { k:'img'|'vid'|'grad'|'color', t:<value>, v:<version id> }
          img/vid -> t is a SMALL data:image/jpeg;base64 thumbnail (a video sends its poster
                     frame); grad -> t is a linear/radial-gradient(...) string; color -> t is #hex.
          v lets the sender omit t on later slides when the background hasn't changed — the
          phone remembers the last t it saw for each v.
     dim: 0..0.9  how much black to lay over the background so the words stay readable.
   No bg in the doc = the remote looks exactly as it did before. */
(function(){
  const $=id=>document.getElementById(id);
  let ov=null,unsub=null,state=null,tab='flow',lastScroll='',teamId='',wake=null,tick=null,fatal='',signed=false;

  function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function say(m){try{if(typeof showToast==='function')showToast(m)}catch(e){}}

  /* ---- slide background preview ---- */
  const bgCache={};
  function bgResolve(b){
    if(!b||typeof b!=='object')return null;
    if(typeof b.t==='string'&&b.t){if(b.v)bgCache[b.v]=b;return b}
    return b.v&&bgCache[b.v]?bgCache[b.v]:null;
  }
  /* Only paint values we recognise — never an arbitrary URL from the doc. */
  function bgCss(b){
    if(!b||typeof b.t!=='string')return '';
    const t=b.t;
    if((b.k==='img'||b.k==='vid')&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(t))return 'url("'+t+'") center/cover no-repeat';
    if(b.k==='grad'&&/^(linear|radial)-gradient\([#0-9a-zA-Z%.,()\s\-]+\)$/.test(t))return t;
    if(b.k==='color'&&/^#[0-9a-fA-F]{3,8}$/.test(t))return t;
    return '';
  }
  function fitPrev(){
    const box=$('rmtPv'),sp=$('rmtPrevTxI');
    if(!box||box.hidden||!sp)return;
    const maxH=box.clientHeight*0.84;
    let lo=7,hi=box.clientHeight*0.42,best=lo;
    for(let i=0;i<10;i++){
      const mid=(lo+hi)/2;sp.style.fontSize=mid+'px';
      if(sp.offsetHeight<=maxH&&sp.scrollWidth<=sp.clientWidth+1){best=mid;lo=mid}else hi=mid;
    }
    sp.style.fontSize=best+'px';
  }
  /* The computer uploads a short looping clip and sends its https link in bg.u (only for k:'vid').
     Only https links to .mp4/.webm files are played; the thumbnail stays underneath until the clip is really playing. */
  const VID_RE=/^https:\/\/[^\s"'<>()]+\.(mp4|webm)(\?[^\s"'<>()]*)?$/i;
  /* candidate clip links: PreCenter may send a WebM and an MP4 copy (bg.u, bg.u2); try the one this phone says it can play first */
  /* On the Wi-Fi page the computer serves the clips itself (bg.lu / bg.lu2 / bg.liu, paths like m/bg/x.mp4): no internet needed */
  const LAN_RE=/^m\/[A-Za-z0-9._\-\/]{1,160}\.(mp4|webm|jpe?g|png|webp)$/i;
  const lanUrl=x=>(window.dscLan&&typeof x==='string'&&LAN_RE.test(x)&&x.indexOf('..')<0)?location.origin+'/'+x:'';
  function bgVidList(){
    const b=state&&state.bg;
    if(!b||b.k!=='vid')return [];
    const l=[lanUrl(b.lu),lanUrl(b.lu2)].filter(Boolean).concat([b.u,b.u2].filter(x=>typeof x==='string'&&VID_RE.test(x)));
    const v=document.createElement('video');
    const ok=x=>{const m=/\.webm(\?|$)/i.test(x)?'video/webm; codecs="vp8"':'video/mp4';return v.canPlayType(m)?0:1};
    return l.sort((x,y)=>ok(x)-ok(y)||(/\.webm/i.test(y)?1:0)-(/\.webm/i.test(x)?1:0));
  }
  function vidDbg(t){const d=$('rmtPrevDbg');if(!d)return;d.hidden=!t;d.textContent=t||''}
  async function vidWhy(u){
    let host='',file='';try{const x=new URL(u);host=x.host;file=x.pathname.split('/').pop()}catch(e){}
    try{const r=await fetch(u,{method:'HEAD'});return 'HTTP '+r.status+' '+(r.headers.get('content-type')||'no type')+' '+(r.headers.get('content-length')||'?')+' B ('+host+'/'+file+')'}
    catch(e){
      try{await fetch(u,{method:'HEAD',mode:'no-cors'});return 'link answers but the app cannot read it (CORS). Open '+host+'/\u2026/'+file+' in the browser to see the error'}
      catch(e2){return 'cannot reach '+host+' (wrong public link, or blocked network)'}
    }
  }
  const IMG_RE=/^https:\/\/[^\s"'<>()]+\.(jpe?g|png|webp)(\?[^\s"'<>()]*)?$/i;
  /* sharper 720p picture from the computer's R2 bucket (bg.iu); the small thumbnail stays until it has loaded */
  function paintImg(){
    const b=state&&state.bg,el=$('rmtPrevBg');if(!el)return;
    const u=b&&b.k==='img'&&!state.black?(lanUrl(b.liu)||(typeof b.iu==='string'&&IMG_RE.test(b.iu)?b.iu:'')):'';
    const css='url("'+u+'") center/cover no-repeat';
    if(!u){el._iu='';el._ok='';return}
    if(el._iu===u){if(el._ok===u)el.style.background=css;return}
    el._iu=u;el._ok='';
    const im=new Image();im.onload=()=>{if(el._iu===u){el._ok=u;el.style.background=css}};im.src=u;
  }
  function paintVid(show){
    const v=$('rmtPrevVid');if(!v)return;
    const list=show?bgVidList():[];
    const raw=state&&state.bg&&state.bg.k==='vid'?(state.bg.u||state.bg.lu):'';
    if(!list.length){
      if(v.getAttribute('src')){try{v.pause()}catch(e){}v.removeAttribute('src');try{v.load()}catch(e){}}
      v._k='';v.hidden=true;

      v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');

        const why=await vidWhy(cur);

      };
      v.src=list[0];

  }

  /* ---- Bible tab: the search runs on the computer (it has the Bible files); the answer comes back in state.bq ---- */
  const BV_DEF=[{i:'kjv',n:'KJV'},{i:'asv',n:'ASV'},{i:'bbe',n:'BBE'},{i:'abtag',n:'AB1905'},{i:'mbb',n:'MBB'},{i:'asnd',n:'ASND'},{i:'niv',n:'NIV'},{i:'nkrv',n:'NKRV'}];

  function bqSearch(){
    const q=$('rmtBqIn').value.trim();if(!q)return;
    const rid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  /* text position: alignment icons (left, center, right, justify) + a vertical row (top, middle, bottom) */
  const IC=d=>'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="'+d+'"/></svg>';
  const PL_AL=[['left','Align left','M3 4h14M3 8h18M3 12h14M3 16h18M3 20h14'],['center','Align center','M5 4h14M3 8h18M5 12h14M3 16h18M5 20h14'],['right','Align right','M7 4h14M3 8h18M7 12h14M3 16h18M7 20h14'],['justify','Justify','M3 4h18M3 8h18M3 12h18M3 16h18M3 20h18']];

  function send(t,extra){
    if(!state||state.on===false){say('The laptop has Remote switched off.');return}
    if(typeof firestoreDb==='undefined'||!firestoreDb||!teamId)return;
    const u=(typeof firebaseAuth!=='undefined'&&firebaseAuth&&firebaseAuth.currentUser)||null;
    const doc=Object.assign({t,ts:Date.now(),by:u?u.uid:''},extra||{});
    firestoreDb.collection('presenterCmd').doc(teamId).collection('q').add(doc).catch(e=>{
      const c=e&&e.code?String(e.code):'';
      say(/permission-denied/.test(c)?'PIN not accepted. Scan the QR code again.':'Could not send. Check the Wi-Fi.');
    });
    if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
    /* if the screen did not change after a press, re-attach the listener to fetch the latest */
    const before=stamp();
    setTimeout(()=>{if(ov&&!ov.hidden&&state&&stamp()===before)subscribe()},2500);
  }

  function status(){
    if(fatal)return[fatal,'bad'];
    if(!signed)return['Sign in to use the remote','bad'];
    if(!teamId)return['Join a team first','bad'];
    if(!state)return['Waiting for the laptop','warn'];
    if(state.on===false)return['Remote is off on the laptop','warn'];
    if(Date.now()-(+state.hb||0)>120000)return['No recent signal from the laptop','warn'];
    return['Connected','ok'];
  }

  function msgFor(){
    if(fatal)return fatal;
    if(!signed)return'Sign in to Disciples on this phone, then open the remote again.';
    if(!teamId)return'This account is not on a team yet.';
    if(!state)return'Open PreCenter on the computer, sign in with the same Disciples team, and press the Remote button so it lights up.';
    if(state.on===false)return'The computer turned Remote off. Press the Remote button in PreCenter to turn it back on.';
    return'';
  }

  function setStat(){

      const ms=window.dscLan.ms,up=window.dscLan.open;

  function render(){
    if(!ov||ov.hidden)return;

    $('rmtTop').hidden=tab==='stage'||!live;

    /* Flow: one button per section (V1, V2, C ...) */
    {
      const box=$('rmtSecs');box.textContent='';
      const secs=Array.isArray(state.secs)?state.secs:[];
      $('rmtNoSec').hidden=secs.length>0;
      let ck=-1;secs.forEach((x,k)=>{if(x.i<=state.idx)ck=k});
      secs.forEach((x,k)=>{
        const b=el('button','rmtFlowBtn'+(k===ck?' cur':''),x.k||x.l);b.type='button';b.title=x.l||'';
        b.style.setProperty('--c',x.c||'#4b5160');
        b.onclick=()=>send('go',{i:x.i,sid:state.sid});box.appendChild(b);
      });
    }
    /* Slide: text-only cards, tap one to jump to it; the list follows the live slide */
    {
      const cards=Array.isArray(state.sl)?state.sl:[],slBox=$('rmtSl');
      $('rmtSlH').hidden=!cards.length;$('rmtSlN').textContent=cards.length||'';
      const sig=JSON.stringify([state.sid,cards]);
      if(slBox.dataset.sig!==sig){
        slBox.dataset.sig=sig;slBox.textContent='';
        cards.forEach((c,k)=>{
          const b=el('button','rmtCard');b.type='button';
          const hd=el('div','rmtCH');hd.append(el('i',null,String(k+1)),el('span',null,c.l||('Slide '+(k+1))));
          b.append(hd,el('div','rmtCT',c.t||'(blank slide)'));

      if(tab==='slide'){
        const key=state.sid+':'+cur+':'+cards.length;

          const c=slBox.children[cur];

        }
      }
    }
    $('rmtBlack').classList.toggle('on',!!state.black);
    $('rmtClear').classList.toggle('on',!!state.clear);
    const list=$('rmtList');
    if(!list.dataset.sig||list.dataset.sig!==JSON.stringify([state.items,state.sid])){
      list.dataset.sig=JSON.stringify([state.items,state.sid]);list.textContent='';
      let g=null;
      (state.items||[]).forEach(x=>{
        if(x.g!==g){g=x.g;list.appendChild(el('div','rmtGrp',g||''))}
        const b=el('button','rmtItem'+(x.id===state.sid?' cur':''),x.t);b.type='button';
        b.onclick=()=>{send('song',{id:x.id});$('rmtListBox').open=false};list.appendChild(b);
      });
    }
    if(tab==='bible')renderBible();
    $('stgLab').textContent=state.label||'';
    $('stgTitle').textContent=state.title||'';
    $('stgText').textContent=state.black?'':(state.text||'');
    $('stgMsg').textContent=state.msg||'';
    $('stgNum').textContent=n?(at+' / '+n):'';
    const nx=$('stgNext');nx.textContent='';
    const nxt=state.next||(at<n?('Slide '+(at+1)):'');
    if(nxt){nx.append(el('b',null,'NEXT'),document.createTextNode(nxt))}
    clock();
    if(tab==='stage')fit();
  }

  function clock(){
    const c=$('stgClock');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    if(ov&&!ov.hidden)setStat();
  }

  function fit(){
    const box=$('stgMain'),t=$('stgText');if(!box||!t)return;
    let lo=14,hi=Math.min(box.clientWidth,box.clientHeight)*0.62||60,best=lo;
    for(let i=0;i<12;i++){
      const mid=(lo+hi)/2;t.style.fontSize=mid+'px';
      if(t.scrollHeight<=box.clientHeight&&t.scrollWidth<=box.clientWidth){best=mid;lo=mid}else hi=mid;
    }
    t.style.fontSize=best+'px';
  }

  /* Wi-Fi remote: PreCenter (desktop app) shows a QR holding http://<computer>:<port>/?pin=123456. The page it opens is served by
     the computer itself and works with no internet. A secure page cannot open a plain ws:// link, so we open that page instead. */
  function wifiGo(txt){
    const t=String(txt||'').trim();
    if(!/^http:\/\/(\d{1,3}\.){3}\d{1,3}:\d{2,5}\/\?pin=\d{6}$/.test(t))return false;
    try{localStorage.setItem('dscLanLast',t)}catch(e){}
    say('Connecting over Wi-Fi\u2026');location.href=t;return true;
  }
  /* Scans the QR code PreCenter shows. It never closes by itself: when something goes wrong it says what, and offers
     "Try again", "Paste the link" and "Cancel". Works with the phone's built-in QR reader (BarcodeDetector) and, where
     the phone has none, with the jsQR library loaded when needed. */
  function loadJsQR(){
    return new Promise(res=>{
      if(window.jsQR)return res(window.jsQR);
      const urls=['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'];
      const next=()=>{
        const u=urls.shift();if(!u){if(typeof window.dscQrDecode==='function'){window.jsQR=(d,w,h)=>{const x=window.dscQrDecode({data:d,width:w,height:h});return x?{data:x}:null};return res(window.jsQR)}return res(null)}
        const sc=document.createElement('script');sc.src=u;sc.onload=()=>res(window.jsQR||null);sc.onerror=()=>{sc.remove();next()};document.head.appendChild(sc);
      };next();
    });
  }
  async function wifiScan(){
    const box=el('div','rmtScan');
    box.innerHTML='<video playsinline muted autoplay></video><div class="rmtScanFrame"></div><div class="rmtScanMsg">Starting the camera\u2026</div>'
      +'<div class="rmtScanPaste" hidden><input type="url" inputmode="url" autocomplete="off" placeholder="http://192.168.1.5:8080/?pin=123456"><button type="button" class="rmtBtn" data-a="open">Open</button></div>'
      +'<div class="rmtScanBtns"><button type="button" class="rmtBtn" data-a="retry" hidden>Try again</button><button type="button" class="rmtBtn" data-a="photo">Take a photo of the QR</button><button type="button" class="rmtBtn" data-a="paste">Paste the link</button><button type="button" class="rmtBtn big" data-a="cancel">Cancel</button></div>'
      +'<input type="file" accept="image/*" capture="environment" hidden data-a="file">';
    document.body.appendChild(box);
    const vid=box.querySelector('video'),msgEl=box.querySelector('.rmtScanMsg'),pasteRow=box.querySelector('.rmtScanPaste'),inp=pasteRow.querySelector('input'),btn=a=>box.querySelector('[data-a="'+a+'"]');
    const msg=(t,err)=>{msgEl.textContent=t;msgEl.classList.toggle('err',!!err)};
    let stream=null,stop=false,timer=0,runId=0,R=null;
    /* the reader: the phone's own, or jsQR (loaded the first time it is needed) */
    const reader=async()=>{
      if(R)return R;let det=null,jsq=null;
      try{if('BarcodeDetector' in window){const f=BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():['qr_code'];if(!f||f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}}catch(e){det=null}
      if(!det)jsq=await loadJsQR();
      return R=(det||jsq)?{det,jsq}:null;
    };
    /* read a QR from a picture (a photo taken with the phone's Camera app: this needs no camera permission for this app) */
    const readPhoto=async file=>{
      let bmp=null;try{bmp=await createImageBitmap(file)}catch(e){}
      if(!bmp){bmp=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>no(new Error('picture could not be read'));im.src=u})}
      const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight,rd=await reader();if(!rd)return{err:'noreader'};
      for(const maxW of [1600,900,500]){
        const k=Math.min(1,maxW/w0),cv=document.createElement('canvas');cv.width=Math.round(w0*k);cv.height=Math.round(h0*k);
        const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(bmp,0,0,cv.width,cv.height);
        try{
          if(rd.det){const r=await rd.det.detect(cv);if(r&&r[0])return{val:r[0].rawValue}}
          else{const d=cx.getImageData(0,0,cv.width,cv.height),r=rd.jsq(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});if(r)return{val:r.data}}
        }catch(e){}
      }
      return{val:''};
    };
    const stopCam=()=>{clearTimeout(timer);try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;try{vid.srcObject=null}catch(e){}};
    const end=()=>{stop=true;runId++;stopCam();box.remove()};
    const bad=e=>{
      const n=String(e&&e.name||''),m=String(e&&e.message||e||'');
      if(/NotAllowed|Security/i.test(n))return (window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()
        ?'This version of the app has no camera permission, so Android cannot ask for it (the app needs an update). '
        :'The camera is blocked. Allow it for this app in the phone settings (Settings \u203a Apps \u203a this app \u203a Permissions), then tap Try again. ')
        +'You can still tap Take a photo of the QR, or scan it with the phone\u2019s own Camera app.';
      if(/NotFound|DevicesNotFound/i.test(n))return 'No camera was found on this phone.';
      if(/NotReadable|TrackStart/i.test(n))return 'The camera is being used by another app. Close it, then tap Try again.';
      return 'Could not start the camera ('+(n||'error')+(m?': '+m:'')+'). Tap Try again, or paste the link.';
    };
    const submit=v=>{if(wifiGo(v)){end();return true}return false};
    box.onclick=e=>{                                   /* the phone may need one tap before it lets the camera picture start */
      const b=e.target.closest&&e.target.closest('button');
      if(!b){if(vid.srcObject&&vid.paused)vid.play().catch(()=>{});return}
      const a=b.dataset.a;
      if(a==='cancel')end();
      else if(a==='retry')start();
      else if(a==='photo'){const f=box.querySelector('[data-a="file"]');f.value='';f.click()}
      else if(a==='paste'){pasteRow.hidden=!pasteRow.hidden;if(!pasteRow.hidden){stopCam();msg('Paste the link shown in PreCenter (Screens \u203a Phone remote on this Wi-Fi).');inp.focus()}else start()}
      else if(a==='open'){if(!submit(inp.value.trim()))msg('That is not a PreCenter Wi-Fi link. It looks like http://192.168.1.5:8080/?pin=123456',true)}
    };
    box.querySelector('[data-a="file"]').onchange=async e=>{
      const f=e.target.files&&e.target.files[0];if(!f)return;
      stopCam();pasteRow.hidden=true;msg('Reading the photo\u2026');
      try{
        const r=await readPhoto(f);
        if(r.err==='noreader')msg('This phone has no QR reader built in and the reader could not be loaded (no internet?). Scan the QR with the phone\u2019s own Camera app instead, or tap Paste the link.',true);
        else if(r.val){if(!submit(r.val))msg('That QR is not from PreCenter. Use the one in Screens \u203a Phone remote on this Wi-Fi.',true)}
        else msg('No QR code was found in that photo. Hold the phone closer so the QR fills most of the picture, and take it again.',true);
      }catch(er){msg('Could not read that photo ('+(er&&er.message||er)+'). Try again.',true)}
      btn('retry').hidden=false;
    };
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();btn('open').click()}};

    async function start(){
      const my=++runId;stopCam();btn('retry').hidden=true;pasteRow.hidden=true;msg('Starting the camera\u2026');
      if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){msg('This phone cannot open the live camera here. Tap Take a photo of the QR, scan it with the phone\u2019s own Camera app, or tap Paste the link.',true);btn('retry').hidden=true;return}
      let err=null;
      for(const c of [{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode:'environment'},audio:false},{video:true,audio:false}]){
        try{stream=await navigator.mediaDevices.getUserMedia(c);err=null;break}catch(e){err=e;if(/NotAllowed|Security|NotFound/i.test(String(e&&e.name)))break}
      }
      if(my!==runId){try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}return}
      if(!stream){msg(bad(err),true);btn('retry').hidden=false;return}
      vid.muted=true;vid.setAttribute('muted','');vid.setAttribute('playsinline','');vid.srcObject=stream;
      try{await vid.play()}catch(e){msg('Tap the screen to start the camera.')}          /* blocked until a tap: wait, do not give up */
      if(!R&&!('BarcodeDetector' in window))msg('Loading the QR reader\u2026');
      const rd=await reader();if(my!==runId)return;
      if(!rd){msg('This phone has no QR reader built in and the reader could not be loaded (no internet?). Take a photo of the QR, scan it with the phone\u2019s own Camera app, or tap Paste the link.',true);btn('retry').hidden=false;return}
      let det=rd.det,jsq=rd.jsq;
      msg(vid.paused?'Tap the screen to start the camera.':'Point the camera at the QR code in PreCenter');
      const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let fails=0;
      const tick=async()=>{
        if(stop||my!==runId)return;
        try{
          if(vid.readyState>=2&&vid.videoWidth&&!vid.paused){
            if(/^Tap the screen/.test(msgEl.textContent))msg('Point the camera at the QR code in PreCenter');
            let val='';
            if(det){const r=await det.detect(vid);if(r&&r[0])val=r[0].rawValue}
            else{const k=Math.min(1,640/vid.videoWidth);cv.width=Math.round(vid.videoWidth*k);cv.height=Math.round(vid.videoHeight*k);cx.drawImage(vid,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height),r=jsq(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});if(r)val=r.data}
            fails=0;
            if(val){if(submit(val))return;msg('That QR is not from PreCenter. Use the one in Screens \u203a Phone remote on this Wi-Fi.',true)}
          }
        }catch(e){if(det&&++fails>=10){det=null;jsq=await loadJsQR();if(!jsq){msg('The phone\u2019s QR reader is not working and the other reader could not be loaded. Tap Paste the link.',true);btn('retry').hidden=false;return}}}
        timer=setTimeout(tick,200);
      };
      tick();
    }
    start();
  }
  async function keepAwake(){
    try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}
  }

  /* (re)attach the listener. Re-attaching makes Firestore hand over the latest copy straight away. */
  function subscribe(){
    if(unsub){try{unsub()}catch(e){}unsub=null}
    if(!teamId||typeof firestoreDb==='undefined'||!firestoreDb)return;
    unsub=firestoreDb.collection('presenter').doc(teamId).onSnapshot(snap=>{
      state=snap.exists?snap.data():null;fatal='';render();
    },err=>{
      const c=err&&err.code?String(err.code):'';
      const denied=/permission-denied/.test(c);
      fatal=denied?'PIN not accepted. Scan the QR code again.':'Connection lost, reconnecting…';
      render();
      if(!denied)setTimeout(()=>{if(ov&&!ov.hidden&&fatal)subscribe()},4000);
    });
  }
  const stamp=()=>state?[state.sid,state.idx,state.black,state.clear,state.hb,state.bq&&state.bq.rid].join('|'):'';

  async function open(){
    build();ov.hidden=false;document.documentElement.style.overflow='hidden';
    state=null;fatal='';render();keepAwake();
    tick=setInterval(clock,1000);
    try{await firebaseReadyPromise}catch(e){}
    const ok=typeof firestoreDb!=='undefined'&&firestoreDb&&typeof firebaseAuth!=='undefined'&&firebaseAuth&&firebaseAuth.currentUser;
    signed=!!ok;
    teamId=ok&&typeof getActiveTeamId==='function'?(getActiveTeamId()||''):'';
    if(!ok||!teamId){render();return}
    subscribe();
  }

  function close(){
    if(unsub){unsub();unsub=null}
    clearInterval(tick);tick=null;
    if(wake){try{wake.release()}catch(e){}wake=null}
    if(ov)ov.hidden=true;
    lastScroll='';
    document.documentElement.style.overflow='';
  }

  document.addEventListener('click',e=>{
    if(e.target.closest&&e.target.closest('#remoteOpenBtn')){e.preventDefault();open()}
  });
})();
</script>
<script>
(function(){
  var SITE='https://worship-chords-rho.vercel.app';
  var home=document.getElementById('lanHome');
  function openRemote(){home.hidden=true;document.getElementById('remoteOpenBtn').click()}
  document.getElementById('lanGo').onclick=openRemote;
  document.getElementById('lanSite').onclick=function(){location.href=SITE};
  /* closing the remote shows the start screen again, so the phone is never left on a blank page */
  new MutationObserver(function(){var o=document.getElementById('rmtOv');if(o&&o.hidden)home.hidden=false}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['hidden']});
  openRemote();
})();
</script>
