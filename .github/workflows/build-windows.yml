
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: precenter-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check the shell logic
        run: npm test

      - name: Build installer and portable program
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create stable download filenames
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "dist/Disciples-PreCenter-Setup-*.exe")
          $portable = @(Get-ChildItem "dist/Disciples-PreCenter-Portable-*.exe")

          if ($setup.Count -ne 1) {
            throw "Expected exactly one Setup installer."
          }

          if ($portable.Count -ne 1) {
            throw "Expected exactly one Portable installer."
          }

          Copy-Item $setup[0].FullName "dist/Disciples-PreCenter-Setup.exe"
          Copy-Item $portable[0].FullName "dist/Disciples-PreCenter-Portable.exe"

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: Disciples-PreCenter-Windows
          path: |
            precenter-desktop/dist/Disciples-PreCenter-Setup-*.exe
            precenter-desktop/dist/Disciples-PreCenter-Portable-*.exe
            precenter-desktop/dist/Disciples-PreCenter-Setup.exe
            precenter-desktop/dist/Disciples-PreCenter-Portable.exe
            precenter-desktop/dist/latest.yml
            precenter-desktop/dist/Disciples-PreCenter-Setup-*.exe.blockmap
          if-no-files-found: error

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            precenter-desktop/dist/Disciples-PreCenter-Setup-*.exe
            precenter-desktop/dist/Disciples-PreCenter-Portable-*.exe
            precenter-desktop/dist/Disciples-PreCenter-Setup.exe
            precenter-desktop/dist/Disciples-PreCenter-Portable.exe
            precenter-desktop/dist/latest.yml
            precenter-desktop/dist/Disciples-PreCenter-Setup-*.exe.blockmap
